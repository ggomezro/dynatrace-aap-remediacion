---
- name: Remediación desde Dynatrace
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: nginx caído
      condition: event.payload.scenario == "nginx_down"
      action:
        run_job_template:
          name: "Remediar nginx"
          organization: "Default"
          job_args:
            extra_vars:
              target_host: "{{ event.payload.host }}"
              problem_id: "{{ event.payload.problem_id }}"
